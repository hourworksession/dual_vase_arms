# Independent, simultaneous extruder control for two manual_steppers
# (right = T0, left = T1). Included from printer.cfg. Needs Klipper
# v0.13.0-106 or newer (MANUAL_STEPPER ... GCODE_AXIS).
#
#   EXTRUDE_TEMP  T=0 TARGET=215 [WAIT=1]     heat a tool (WAIT=1 blocks until within 5 C)
#   EXTRUDE_ON    T=0 RATE=3.0 [TIMEOUT=5]    run at RATE mm/s until EXTRUDE_OFF
#   EXTRUDE_OFF   [T=0]                        stop one tool, or both
#   EXTRUDE_SCALE T=0 PERCENT=80               live throttle
#   EXTRUDE_MM    T=0 MM=5 RATE=3              dose: push MM and stop (negative retracts)
#   EXTRUDE_STATUS
#
# How it works: at start-up both steppers are registered as G-code axes
# (right = A, left = B). While any tool is on, _EXT_TICK runs every PERIOD
# seconds and queues ONE G1 move that turns both extruders together for the
# time that has passed since the last tick (A = right rate x dt, B = left
# rate x dt). Klipper's look-ahead joins these moves into one continuous
# motion, so the two extruders never wait on each other.
#
# Each move also carries a dummy X distance (VX x dt). kinematics is "none",
# so X drives nothing, but without it Klipper treats the move as
# "extrude only" and brings the motors to a stop between every move.
#
# The first tick queues LEAD seconds of flow, so a late tick can't leave a
# gap. The cost: EXTRUDE_OFF stops the flow up to LEAD (+ one PERIOD) later.
#
# Watchdog: EXTRUDE_ON sets a deadline TIMEOUT seconds ahead; re-send
# EXTRUDE_ON at least every TIMEOUT/2 s while printing. If the deadline lapses
# the tool stops itself.
#
# While the steppers are G-code axes, "MANUAL_STEPPER ... MOVE=" and
# "MANUAL_STEPPER ... SYNC=1" are refused by Klipper; use EXTRUDE_MM and M400.

[gcode_macro _EXT]
variable_on: [0, 0]
variable_rate: [0.0, 0.0]
variable_scale: [100.0, 100.0]
variable_deadline: [0.0, 0.0]
variable_period: 0.1
variable_lead: 0.3
variable_vx: 100.0
variable_running: 0
variable_last: 0.0
variable_names: ["right", "left"]
variable_axes: ["A", "B"]
variable_heaters: ["right_hotend", "left_hotend"]
gcode:

[delayed_gcode _EXT_INIT]
initial_duration: 0.5
gcode:
    MANUAL_STEPPER STEPPER=right GCODE_AXIS=A LIMIT_VELOCITY=30 LIMIT_ACCEL=500 INSTANTANEOUS_CORNER_VELOCITY=4
    MANUAL_STEPPER STEPPER=left GCODE_AXIS=B LIMIT_VELOCITY=30 LIMIT_ACCEL=500 INSTANTANEOUS_CORNER_VELOCITY=4
    G90

[gcode_macro EXTRUDE_TEMP]
gcode:
    {% set t = params.T|default(0)|int %}
    {% set target = params.TARGET|default(0)|float %}
    {% set h = printer["gcode_macro _EXT"].heaters[t] %}
    SET_HEATER_TEMPERATURE HEATER={h} TARGET={target}
    {% if params.WAIT|default(0)|int and target > 0 %}
        TEMPERATURE_WAIT SENSOR="heater_generic {h}" MINIMUM={target - 5} MAXIMUM={target + 5}
    {% endif %}

[gcode_macro EXTRUDE_ON]
gcode:
    {% set t = params.T|default(0)|int %}
    {% set rate = params.RATE|default(3.0)|float %}
    {% set timeout = params.TIMEOUT|default(5.0)|float %}
    {% set st = printer["gcode_macro _EXT"] %}
    {% if t not in [0, 1] %}{action_raise_error("EXTRUDE_ON: T must be 0 or 1")}{% endif %}
    {% if rate <= 0 %}{action_raise_error("EXTRUDE_ON: RATE must be > 0")}{% endif %}
    {% set now = printer.toolhead.estimated_print_time %}
    {% set dl = now + timeout %}
    {% if not (st.on[0] or st.on[1]) %}
        SET_GCODE_VARIABLE MACRO=_EXT VARIABLE=last VALUE={now - st.lead}
    {% endif %}
    SET_GCODE_VARIABLE MACRO=_EXT VARIABLE=on VALUE=[{1 if t == 0 else st.on[0]},{1 if t == 1 else st.on[1]}]
    SET_GCODE_VARIABLE MACRO=_EXT VARIABLE=rate VALUE=[{rate if t == 0 else st.rate[0]},{rate if t == 1 else st.rate[1]}]
    SET_GCODE_VARIABLE MACRO=_EXT VARIABLE=deadline VALUE=[{dl if t == 0 else st.deadline[0]},{dl if t == 1 else st.deadline[1]}]
    {% if not st.running %}
        SET_GCODE_VARIABLE MACRO=_EXT VARIABLE=running VALUE=1
        UPDATE_DELAYED_GCODE ID=_EXT_TICK DURATION=0.01
    {% endif %}

[gcode_macro EXTRUDE_OFF]
gcode:
    {% set t = params.T|default(-1)|int %}
    {% set st = printer["gcode_macro _EXT"] %}
    SET_GCODE_VARIABLE MACRO=_EXT VARIABLE=on VALUE=[{0 if t in [0, -1] else st.on[0]},{0 if t in [1, -1] else st.on[1]}]

[gcode_macro EXTRUDE_SCALE]
gcode:
    {% set t = params.T|default(0)|int %}
    {% set pct = params.PERCENT|default(100)|float %}
    {% if pct < 0 or pct > 300 %}{action_raise_error("EXTRUDE_SCALE: PERCENT 0..300")}{% endif %}
    {% set st = printer["gcode_macro _EXT"] %}
    SET_GCODE_VARIABLE MACRO=_EXT VARIABLE=scale VALUE=[{pct if t == 0 else st.scale[0]},{pct if t == 1 else st.scale[1]}]

[gcode_macro EXTRUDE_MM]
gcode:
    {% set t = params.T|default(0)|int %}
    {% set mm = params.MM|default(0)|float %}
    {% set rate = params.RATE|default(3.0)|float %}
    {% set st = printer["gcode_macro _EXT"] %}
    {% if t not in [0, 1] %}{action_raise_error("EXTRUDE_MM: T must be 0 or 1")}{% endif %}
    {% if rate <= 0 %}{action_raise_error("EXTRUDE_MM: RATE must be > 0")}{% endif %}
    {% if st.on[0] or st.on[1] %}{action_raise_error("EXTRUDE_MM: a tool is running, EXTRUDE_OFF first")}{% endif %}
    {% if mm != 0 %}
        G91
        G1 X{"%.4f" % (st.vx * (mm|abs) / rate)} {st.axes[t]}{"%.4f" % mm} F{st.vx * 60}
        G90
    {% endif %}

[gcode_macro EXTRUDE_STATUS]
gcode:
    {% set st = printer["gcode_macro _EXT"] %}
    {% set now = printer.toolhead.estimated_print_time %}
    {action_respond_info("T0 right: on=%d rate=%.2f scale=%.0f%% wd=%.1fs | T1 left: on=%d rate=%.2f scale=%.0f%% wd=%.1fs | ticking=%d"
        % (st.on[0], st.rate[0], st.scale[0], st.deadline[0] - now,
           st.on[1], st.rate[1], st.scale[1], st.deadline[1] - now, st.running))}

# One timer for both tools: each tick queues a single G1 that turns both.
[delayed_gcode _EXT_TICK]
gcode:
    _EXT_STEP

[gcode_macro _EXT_STEP]
gcode:
    {% set st = printer["gcode_macro _EXT"] %}
    {% set now = printer.toolhead.estimated_print_time %}
    {% set on0 = st.on[0] and now <= st.deadline[0] %}
    {% set on1 = st.on[1] and now <= st.deadline[1] %}
    {% for t in [0, 1] %}
        {% if st.on[t] and now > st.deadline[t] %}
            {action_respond_info("EXTRUDE watchdog: T%d had no keepalive, stopped" % t)}
        {% endif %}
    {% endfor %}
    {% if on0 or on1 %}
        {% set dt = [[now - st.last, 0.0]|max, 0.5]|min %}
        {% set va = st.rate[0] * st.scale[0] / 100.0 if on0 else 0.0 %}
        {% set vb = st.rate[1] * st.scale[1] / 100.0 if on1 else 0.0 %}
        {% if dt > 0.001 and (va > 0 or vb > 0) %}
            G91
            G1 X{"%.4f" % (st.vx * dt)} A{"%.5f" % (va * dt)} B{"%.5f" % (vb * dt)} F{st.vx * 60}
            G90
        {% endif %}
        SET_GCODE_VARIABLE MACRO=_EXT VARIABLE=last VALUE={now}
        SET_GCODE_VARIABLE MACRO=_EXT VARIABLE=on VALUE=[{1 if on0 else 0},{1 if on1 else 0}]
        UPDATE_DELAYED_GCODE ID=_EXT_TICK DURATION={st.period}
    {% else %}
        SET_GCODE_VARIABLE MACRO=_EXT VARIABLE=on VALUE=[0,0]
        SET_GCODE_VARIABLE MACRO=_EXT VARIABLE=running VALUE=0
    {% endif %}
