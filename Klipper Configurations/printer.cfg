# TEST CONFIG: two independent extruders on the SKR Pico (no toolhead axes).
#
#   right (T0): motor on the E (extruder) driver, Revo HF on HE0 + TH0
#   left  (T1): motor on the X driver,            hot end on the BED heater + THB
#
# Pins are from BIGTREETECH's official "SKR Pico klipper.cfg" (github.com/bigtreetech/SKR-Pico).
# Before loading, compare with the printer.cfg running on the Pi now and CHECK THREE THINGS:
#   1. [mcu] serial      : copy the line from the current config (it is unique to your board)
#   2. dir_pin ! signs   : if the current config has a different ! on gpio10 or gpio13, keep yours
#   3. sensor_type       : both hot ends are Revo, which use ATC Semitec 104NT-4-R025H42G;
#                          if the current config uses another type and reads correctly, keep yours
#
# While this config is loaded the cell studio panel's extrusion will NOT work
# (it sends G1 X/E moves and reads [extruder]/[heater_bed]). Test by hand, then
# restore the old config. See README.md in this folder.

[mcu]
serial: /dev/serial/by-id/usb-Klipper_rp2040_REPLACE-WITH-YOURS-if00

[printer]
kinematics: none
max_velocity: 300
max_accel: 3000

# ---------------------------------------------------------------- right (T0)
[manual_stepper right]
step_pin: gpio14                 # SKR Pico E driver
dir_pin: !gpio13
enable_pin: !gpio15
microsteps: 16
rotation_distance: 7.82          # E3D Hemera; check with the 100 mm push test
full_steps_per_rotation: 200
velocity: 20
accel: 500

[tmc2209 manual_stepper right]
uart_pin: gpio9
tx_pin: gpio8
uart_address: 3
run_current: 0.650
stealthchop_threshold: 999999

[heater_generic right_hotend]
heater_pin: gpio23               # HE0
sensor_type: ATC Semitec 104NT-4-R025H42G
sensor_pin: gpio27               # TH0
control: pid
pid_Kp: 25.0                     # replace after PID_CALIBRATE HEATER=right_hotend TARGET=225
pid_Ki: 1.5
pid_Kd: 100.0
min_temp: 0
max_temp: 300

[verify_heater right_hotend]
max_error: 120
check_gain_time: 30
hysteresis: 8
heating_gain: 2

# ----------------------------------------------------------------- left (T1)
[manual_stepper left]
step_pin: gpio11                 # SKR Pico X driver
dir_pin: !gpio10
enable_pin: !gpio12
microsteps: 16
rotation_distance: 7.82          # check separately; flip ! on dir_pin if it runs backwards
full_steps_per_rotation: 200
velocity: 20
accel: 500

[tmc2209 manual_stepper left]
uart_pin: gpio9
tx_pin: gpio8
uart_address: 0
run_current: 0.650
stealthchop_threshold: 999999

[heater_generic left_hotend]
heater_pin: gpio21               # bed heater output (HB)
sensor_type: ATC Semitec 104NT-4-R025H42G
sensor_pin: gpio26               # THB
control: pid
pid_Kp: 25.0                     # replace after PID_CALIBRATE HEATER=left_hotend TARGET=225
pid_Ki: 1.5
pid_Kd: 100.0
min_temp: 0
max_temp: 300

[verify_heater left_hotend]
max_error: 120
check_gain_time: 30
hysteresis: 8
heating_gain: 2

# ------------------------------------------------------------------- fans
[heater_fan right_hotend_fan]    # FAN2 on the Pico; change if your fans are wired elsewhere
pin: gpio18
heater: right_hotend
heater_temp: 50.0

[heater_fan left_hotend_fan]
pin: gpio20                      # FAN3
heater: left_hotend
heater_temp: 50.0

# ---------------------------------------------------------------- general
[idle_timeout]
timeout: 1800
gcode:
    EXTRUDE_OFF
    EXTRUDE_TEMP T=0 TARGET=0
    EXTRUDE_TEMP T=1 TARGET=0

[respond]

[include extrude_control.cfg]
