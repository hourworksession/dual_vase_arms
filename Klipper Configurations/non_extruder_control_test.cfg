# ======================================================================
#  SKR Pico V1.0 – TEST: two independent extruders, no toolhead axes
# ======================================================================
# Built from stepX_left_control.cfg (the config that works today): same pins,
# serial, thermistors (PT1000), PID values, motor currents, rotation_distance
# and fans. What changes:
#   - kinematics none: no X/Y/Z axes, no dummy Y and Z steppers
#   - right (T0, was [extruder])  -> [manual_stepper right] + [heater_generic right_hotend]
#   - left  (T1, was [stepper_x] + [heater_bed]) -> [manual_stepper left] + [heater_generic left_hotend]
#   - extrusion is driven by the EXTRUDE_* macros in extrude_control.cfg
#
# While this is loaded, the cell studio panel's extrusion will NOT work (it sends
# G1 X/E moves and reads [extruder]/[heater_bed]). To test: save this as the Pi's
# printer.cfg, add extrude_control.cfg next to it, FIRMWARE_RESTART. To go back:
# put stepX_left_control.cfg back as printer.cfg. Steps in README.md.

[include mainsail.cfg]

[mcu]
serial: /dev/serial/by-id/usb-Klipper_rp2040_50445059308A271C-if00

[printer]
kinematics: none
max_velocity: 300
max_accel: 3000

# ----------------------------------------------------------------------
# Right nozzle (T0) – E driver, HE0, TH0
# ----------------------------------------------------------------------
[manual_stepper right]
step_pin: gpio14
dir_pin: !gpio13
enable_pin: !gpio15
microsteps: 16
rotation_distance: 8.06
velocity: 20                     # mm/s if a move gives none
accel: 500

[tmc2209 manual_stepper right]
uart_pin: gpio9
tx_pin: gpio8
uart_address: 3
run_current: 0.90
stealthchop_threshold: 999999

[heater_generic right_hotend]
heater_pin: gpio23
sensor_type: PT1000
sensor_pin: gpio27
control: pid
pid_Kp: 21.527
pid_Ki: 0.995
pid_Kd: 108.982
min_temp: -50
max_temp: 250

[verify_heater right_hotend]
max_error: 120
check_gain_time: 30
hysteresis: 8
heating_gain: 2

# ----------------------------------------------------------------------
# Left nozzle (T1) – X driver, bed heater output, THB
# ----------------------------------------------------------------------
[manual_stepper left]
step_pin: gpio11
dir_pin: !gpio10
enable_pin: !gpio12
microsteps: 16
rotation_distance: 8.06
velocity: 20
accel: 500

[tmc2209 manual_stepper left]
uart_pin: gpio9
tx_pin: gpio8
uart_address: 0
run_current: 0.9
stealthchop_threshold: 999999

[heater_generic left_hotend]
heater_pin: gpio21
sensor_type: PT1000
sensor_pin: gpio26
control: pid
pid_Kp: 21.527
pid_Ki: 0.995
pid_Kd: 108.982
min_temp: -50
max_temp: 250

[verify_heater left_hotend]
max_error: 120
check_gain_time: 30
hysteresis: 8
heating_gain: 2

# ----------------------------------------------------------------------
# Fans (same pins as now)
# ----------------------------------------------------------------------
[fan]
pin: gpio17

[heater_fan heatbreak_cooling_fan]
pin: gpio18
heater: right_hotend

[heater_fan heatbreak_cooling_fan2]
pin: gpio20
heater: left_hotend
heater_temp: 15                  # as in the current config: effectively always on

# ----------------------------------------------------------------------
# Miscellaneous
# ----------------------------------------------------------------------
[temperature_sensor pico]
sensor_type: temperature_mcu

[neopixel board_neopixel]
pin: gpio24
chain_count: 1
color_order: GRB
initial_RED: 0.3
initial_GREEN: 0.3
initial_BLUE: 0.3

[idle_timeout]
timeout: 1800
gcode:
    EXTRUDE_OFF
    EXTRUDE_TEMP T=0 TARGET=0
    EXTRUDE_TEMP T=1 TARGET=0

[include extrude_control.cfg]
