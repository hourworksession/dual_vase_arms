# ======================================================================
#  SKR Pico V1.0 – Dual Extruder Synchronous Setup (cartesian)
# ======================================================================
[include mainsail.cfg]

[force_move]
enable_force_move: True

# ----------------------------------------------------------------------
# Kinematics
# ----------------------------------------------------------------------
[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 3000

# ----------------------------------------------------------------------
# Primary Extruder (Tool 0) – E axis
# ----------------------------------------------------------------------
[extruder]
step_pin: gpio14
dir_pin: !gpio13
enable_pin: !gpio15
microsteps: 16
rotation_distance: 8.06
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: gpio23
sensor_type: PT1000
sensor_pin: gpio27
control: pid
pid_Kp: 21.527
pid_Ki: 0.995
pid_Kd: 108.982
min_temp: -50
max_temp: 250
min_extrude_temp: 50
max_extrude_cross_section: 1000.0   # allow large extrusion moves for testing
max_extrude_only_distance: 999999
max_extrude_only_velocity: 30
max_extrude_only_accel: 2500

[tmc2209 extruder]
uart_pin: gpio9
tx_pin: gpio8
uart_address: 3
run_current: 0.90
stealthchop_threshold: 999999

# ----------------------------------------------------------------------
# Second Nozzle – Motion on X axis, Temperature via heater_bed
# ----------------------------------------------------------------------
[stepper_x]
step_pin: gpio11
dir_pin: !gpio10
enable_pin: !gpio12
microsteps: 16
rotation_distance: 8.06
endstop_pin: gpio2              # unused dummy pin
position_endstop: 0
position_min: -999999
position_max: 999999
homing_speed: 5
homing_positive_dir: True

[tmc2209 stepper_x]
uart_pin: gpio9
tx_pin: gpio8
uart_address: 0
run_current: 0.9
stealthchop_threshold: 999999

[heater_bed]
heater_pin: gpio21
sensor_type: PT1000
sensor_pin: gpio26
control: pid
pid_Kp: 21.527
pid_Ki: 0.995
pid_Kd: 108.982
min_temp: -50
max_temp: 250

# ----------------------------------------------------------------------
# Dummy Y and Z axes (required by cartesian, never moved)
# ----------------------------------------------------------------------
[stepper_y]
step_pin: gpio28
dir_pin: gpio29
enable_pin: !gpio25
microsteps: 16
rotation_distance: 40
endstop_pin: gpio3              # unused dummy
position_endstop: 0
position_min: -999999
position_max: 999999
homing_speed: 5
homing_positive_dir: True

[stepper_z]
step_pin: gpio16
dir_pin: gpio0
enable_pin: !gpio1
microsteps: 16
rotation_distance: 8
endstop_pin: gpio4              # unused dummy
position_endstop: 0
position_min: -999999
position_max: 999999
homing_speed: 5
homing_positive_dir: True

# ----------------------------------------------------------------------
# Fans
# ----------------------------------------------------------------------
[fan]
pin: gpio17

[heater_fan heatbreak_cooling_fan]
pin: gpio18
heater: extruder

[heater_fan heatbreak_cooling_fan2]
pin: gpio20
heater: heater_bed
heater_temp: 15

# ----------------------------------------------------------------------
# Miscellaneous
# ----------------------------------------------------------------------
[temperature_sensor pico]
sensor_type: temperature_mcu

[mcu]
serial: /dev/serial/by-id/usb-Klipper_rp2040_50445059308A271C-if00

[neopixel board_neopixel]
pin: gpio24
chain_count: 1
color_order: GRB
initial_RED: 0.3
initial_GREEN: 0.3
initial_BLUE: 0.3