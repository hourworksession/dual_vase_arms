# Binary extruder control for the dual arm cell: on at a fixed rate, or off.
#
# Add to printer.cfg:   [include extrude_binary.cfg]
#
# Commands (from the control PC, Mainsail console, or anything that can send G-code):
#   EXTRUDE_ON  T=0 RATE=3.0 [TIMEOUT=5]   start tool 0 (E axis) at 3 mm/s
#   EXTRUDE_ON  T=1 RATE=2.5               start tool 1 (X axis, second extruder)
#   EXTRUDE_OFF T=0                         stop tool 0
#   EXTRUDE_OFF                             stop both
#   EXTRUDE_STATUS                          print state
#
# How it works: while a tool's flag is set, a delayed_gcode re-queues one short
# relative move every PERIOD seconds, so Klipper's lookahead runs them as one
# continuous motion. EXTRUDE_OFF clears the flag: at most one PERIOD of filament
# follows. Nothing is queued ahead, so there is no lead to drain.
#
# Watchdog: EXTRUDE_ON sets a deadline TIMEOUT seconds ahead. The control PC
# should re-send EXTRUDE_ON (same arguments) at least every TIMEOUT/2 seconds
# while printing. If the deadline passes, both tools switch off by themselves.
# This is what protects the part if the PC loop hangs or the LAN drops.

[gcode_macro _EXT_STATE]
variable_on0: 0
variable_on1: 0
variable_seg0: 0.0
variable_seg1: 0.0
variable_period: 0.1
variable_deadline: 0.0
gcode:

[gcode_macro EXTRUDE_ON]
description: Start a tool extruding at a fixed rate. T=0|1 RATE=mm/s TIMEOUT=s
gcode:
    {% set t = params.T|default(0)|int %}
    {% set rate = params.RATE|default(3.0)|float %}
    {% set timeout = params.TIMEOUT|default(5.0)|float %}
    {% set st = printer["gcode_macro _EXT_STATE"] %}
    {% if t not in [0, 1] %}
        {action_raise_error("EXTRUDE_ON: T must be 0 or 1")}
    {% endif %}
    {% if rate <= 0 %}
        {action_raise_error("EXTRUDE_ON: RATE must be > 0")}
    {% endif %}
    {% set was_running = st.on0 or st.on1 %}
    SET_GCODE_VARIABLE MACRO=_EXT_STATE VARIABLE=on{t} VALUE=1
    SET_GCODE_VARIABLE MACRO=_EXT_STATE VARIABLE=seg{t} VALUE={rate * st.period}
    SET_GCODE_VARIABLE MACRO=_EXT_STATE VARIABLE=deadline VALUE={printer.toolhead.estimated_print_time + timeout}
    {% if not was_running %}
        UPDATE_DELAYED_GCODE ID=_EXT_PULSE DURATION=0.01
    {% endif %}

[gcode_macro EXTRUDE_OFF]
description: Stop a tool, or both if T is omitted.
gcode:
    {% set t = params.T|default(-1)|int %}
    {% if t == 0 or t == -1 %}
        SET_GCODE_VARIABLE MACRO=_EXT_STATE VARIABLE=on0 VALUE=0
    {% endif %}
    {% if t == 1 or t == -1 %}
        SET_GCODE_VARIABLE MACRO=_EXT_STATE VARIABLE=on1 VALUE=0
    {% endif %}

[gcode_macro EXTRUDE_STATUS]
gcode:
    {% set st = printer["gcode_macro _EXT_STATE"] %}
    {action_respond_info("ext0=%s ext1=%s seg0=%.3f seg1=%.3f period=%.2f deadline_in=%.1fs"
        % (st.on0, st.on1, st.seg0, st.seg1, st.period,
           st.deadline - printer.toolhead.estimated_print_time))}

[delayed_gcode _EXT_PULSE]
gcode:
    {% set st = printer["gcode_macro _EXT_STATE"] %}
    {% if st.on0 or st.on1 %}
        {% if printer.toolhead.estimated_print_time > st.deadline %}
            EXTRUDE_OFF
            {action_respond_info("EXTRUDE watchdog: no keepalive, extruders off")}
        {% else %}
            {% set e = st.seg0 if st.on0 else 0.0 %}
            {% set x = st.seg1 if st.on1 else 0.0 %}
            {% set dist = (e * e + x * x) ** 0.5 %}
            {% set feed = (dist / st.period) * 60.0 %}
            M83
            G91
            G1 E{"%.4f" % e} X{"%.4f" % x} F{"%.1f" % feed}
            G90
            UPDATE_DELAYED_GCODE ID=_EXT_PULSE DURATION={st.period}
        {% endif %}
    {% endif %}
