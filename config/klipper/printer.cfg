# printer.cfg for the dual arm cell extruder board.
#
# The board drives NO toolhead axes. It owns two independent extruders:
#   right (T0): the motor on the EXTRUDER driver, REVO HF 1.2 mm on the
#               extruder heater and thermistor pins
#   left  (T1): the motor on the X driver, hot end on the BED heater and
#               BED thermistor pins
# Both are manual_steppers so they can run at the same time with their own
# rate, acceleration and stop. There is no [extruder] section on purpose:
# M104 / M109 / G1 E will not work, use the EXTRUDE_* macros below.
#
# FILL IN: every pin marked <...> must be copied from your current printer.cfg
#   [stepper_x]  -> manual_stepper left     (step, dir, enable pins; rotation_distance)
#   [extruder]   -> manual_stepper right    (step, dir, enable; heater_pin, sensor_pin, sensor_type)
#   [heater_bed] -> heater_generic left_hotend (heater_pin, sensor_pin)
#   [tmc2209 ...] sections, if any, keep them but rename the header to
#   [tmc2209 manual_stepper left] and [tmc2209 manual_stepper right].

[mcu]
serial: <copy from current [mcu]>

[printer]
kinematics: none
max_velocity: 300
max_accel: 3000

# ---------------------------------------------------------------- right (T0)
[manual_stepper right]
step_pin: <current [extruder] step_pin>
dir_pin: <current [extruder] dir_pin>
enable_pin: <current [extruder] enable_pin>
microsteps: 16
rotation_distance: 7.82          # E3D Hemera; verify with a 100 mm push
full_steps_per_rotation: 200
velocity: 20                     # default mm/s if a MOVE gives none
accel: 500                       # default mm/s^2

[heater_generic right_hotend]
heater_pin: <current [extruder] heater_pin>
sensor_type: ATC Semitec 104NT-4-R025H42G   # REVO heater core sensor; confirm
sensor_pin: <current [extruder] sensor_pin>
control: pid
pid_Kp: 25.0                     # run PID_CALIBRATE HEATER=right_hotend TARGET=215
pid_Ki: 1.5
pid_Kd: 100.0
min_temp: 0
max_temp: 300

[verify_heater right_hotend]
max_error: 120
check_gain_time: 30
hysteresis: 8
heating_gain: 2

# ----------------------------------------------------------------- left (T1)
[manual_stepper left]
step_pin: <current [stepper_x] step_pin>
dir_pin: <current [stepper_x] dir_pin>
enable_pin: <current [stepper_x] enable_pin>
microsteps: 16
rotation_distance: 7.82          # verify independently; direction may need ! on dir_pin
full_steps_per_rotation: 200
velocity: 20
accel: 500

[heater_generic left_hotend]
heater_pin: <current [heater_bed] heater_pin>
sensor_type: <current [heater_bed] sensor_type, or the hot end's thermistor type>
sensor_pin: <current [heater_bed] sensor_pin>
control: pid
pid_Kp: 25.0                     # run PID_CALIBRATE HEATER=left_hotend TARGET=215
pid_Ki: 1.5
pid_Kd: 100.0
min_temp: 0
max_temp: 300

[verify_heater left_hotend]
max_error: 120
check_gain_time: 30
hysteresis: 8
heating_gain: 2

# ------------------------------------------------------------------ general
[idle_timeout]
timeout: 1800
gcode:
    EXTRUDE_OFF
    EXTRUDE_TEMP T=0 TARGET=0
    EXTRUDE_TEMP T=1 TARGET=0

[respond]

[include extrude_control.cfg]
