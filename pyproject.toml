[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dual_vase_arms"
version = "0.1.0"
description = "Control software for the dual xArm 850 + ADRS turntable robotic AM cell"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Wil" }]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pyyaml>=6.0",
    "matplotlib>=3.8",
    "trimesh>=4.0",
    "shapely>=2.0",
    "fullcontrol>=0.5.0",
    "xarm-python-sdk>=1.13.0",
    "requests>=2.31",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=4.1", "ruff>=0.4", "mypy>=1.10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
